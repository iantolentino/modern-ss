<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none">
  <!-- An authored highlighter sweep: two overlapping passes of uneven pressure,
       with the lift-off tail at the end. The colour is the brand teal, read off
       the logo (#00544E) and lifted into a marker wash so ink stays legible. -->
  <g fill="none" stroke="#B7DAD3" stroke-linecap="butt">
    <path d="M2 57 C 132 45, 266 68, 408 54 S 702 43, 986 55" stroke-width="66"/>
    <path d="M8 68 C 158 61, 302 76, 474 64 S 786 56, 972 67" stroke-width="43" opacity=".72"/>
  </g>
  <path d="M954 46 L 1000 60 L 954 74 Z" fill="#B7DAD3" opacity=".55"/>
</svg>
